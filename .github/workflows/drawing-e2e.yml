name: Drawing browser tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run real-browser drawing tests
        run: npm run test:e2e
      - name: Upload synthetic-only UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-terminal-ui-review
          path: test-results/review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          if-no-files-found: ignore
