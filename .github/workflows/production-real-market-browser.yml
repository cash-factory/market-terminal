name: Production real-market browser smoke
on:
  pull_request:
    paths:
      - "src/market.ts"
      - "src/App.tsx"
      - "src/data/**"
      - "src/charts/MarketBoard.tsx"
      - "scripts/verify-production-markets.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build actual production mode (no synthetic fixtures)
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/market-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/market-terminal/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/market-preview.log
          exit 1
      - name: Verify actual source and explicit no-provider state
        run: node scripts/verify-production-markets.mjs
      - name: Capture actual production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-market-browser-screens
          path: test-results/production-real/
          if-no-files-found: ignore
          retention-days: 7
